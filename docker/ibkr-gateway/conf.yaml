# IBKR Client Portal Gateway configuration
# Tuned for containerised deployment — allow cluster IPs, port 5000, self-signed TLS.
# The gateway always uses HTTPS; WiseWizard's HttpClient must trust the self-signed cert.

ip2loc: "US"
proxyRemoteSsl: true
proxyRemoteHost: "https://api.ibkr.com"
listenPort: 5000
listenSsl: true
ccp: false
svcEnvironment: "v1"
sslCert: "vertx.jks"
sslPwd: "mywebapi"
authDelay: 3000
portalBaseURL: ""

serverOptions:
    blockedThreadCheckInterval: 1000000
    eventLoopPoolSize: 20
    workerPoolSize: 20
    maxWorkerExecuteTime: 100
    internalBlockingPoolSize: 20

cors:
    origin.allowed: "*"
    allowCredentials: false

webApps:
    - name: "demo"
      index: "index.html"

# Allow all pod/cluster IPs to reach the gateway.
ips:
  allow:
    - "*"
  deny: []
