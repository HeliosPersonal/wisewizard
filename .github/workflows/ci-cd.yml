name: CI/CD Pipeline

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read
  packages: write

env:
  DOCKER_REGISTRY: ghcr.io
  IMAGE_TAG: ${{ github.sha }}

jobs:
  # ============================================================================
  # BUILD & TEST
  # ============================================================================
  build-and-test:
    name: Build & Test
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v6

      - name: Setup .NET
        uses: actions/setup-dotnet@v5
        with:
          dotnet-version: '10.0.x'

      - name: Restore dependencies
        run: dotnet restore WiseWizard.slnx

      - name: Build solution
        run: dotnet build WiseWizard.slnx --no-restore --configuration Release

      - name: Run tests with coverage gate
        # CollectCoverage=true activates the >95% line+branch threshold defined in
        # tests/Directory.Build.props. Docker is available on ubuntu-latest for Testcontainers.
        run: dotnet test WiseWizard.slnx --no-build --configuration Release -p:CollectCoverage=true --verbosity normal

  # ============================================================================
  # BUILD & PUSH DOCKER IMAGE
  # ============================================================================
  build-image:
    name: Build & Push Docker Image
    needs: build-and-test
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v6

      - name: Lowercase owner
        id: repo_owner
        run: |
          echo "owner_lc=$(echo ${{ github.repository_owner }} | tr '[:upper:]' '[:lower:]')" >> $GITHUB_OUTPUT

      - name: Login to GitHub Container Registry
        uses: docker/login-action@v4
        with:
          registry: ${{ env.DOCKER_REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Compute image tags
        id: image_tags
        run: |
          IMAGE="${{ env.DOCKER_REGISTRY }}/${{ steps.repo_owner.outputs.owner_lc }}/wisewizard"
          echo "value=${IMAGE}:${{ env.IMAGE_TAG }},${IMAGE}:latest" >> $GITHUB_OUTPUT

      - name: Build & push
        uses: docker/build-push-action@v7
        with:
          context: .
          file: src/WiseWizard.Host/Dockerfile
          push: true
          tags: ${{ steps.image_tags.outputs.value }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

  # ============================================================================
  # TERRAFORM - Provision infrastructure (database)
  # Runs after images are built. Creates the wisewizard database in the shared
  # postgres instance if it does not already exist.
  # ============================================================================
  terraform:
    name: Terraform
    needs: build-image
    runs-on: self-hosted
    environment: production
    defaults:
      run:
        working-directory: terraform

    env:
      ARM_CLIENT_ID:       ${{ secrets.ARM_CLIENT_ID }}
      ARM_CLIENT_SECRET:   ${{ secrets.ARM_CLIENT_SECRET }}
      ARM_TENANT_ID:       ${{ secrets.ARM_TENANT_ID }}
      ARM_SUBSCRIPTION_ID: ${{ secrets.ARM_SUBSCRIPTION_ID }}
      TF_VAR_pg_password:  ${{ secrets.PG_PASSWORD }}

    steps:
      - name: Checkout code
        uses: actions/checkout@v6

      - name: Set kubeconfig path
        run: |
          echo "KUBECONFIG=$HOME/.kube/config" >> $GITHUB_ENV
          echo "TF_VAR_kubeconfig_path=$HOME/.kube/config" >> $GITHUB_ENV

      - name: Verify Kubernetes access
        run: kubectl cluster-info

      - name: Terraform Init
        run: terraform init

      - name: Terraform Validate
        run: terraform validate

      - name: Terraform Plan
        id: plan
        run: |
          terraform plan -no-color -detailed-exitcode -out=tfplan 2>&1 | tee plan.txt
          EXIT_CODE=${PIPESTATUS[0]}
          if [ $EXIT_CODE -eq 0 ]; then
            echo "has_changes=false" >> $GITHUB_OUTPUT
          elif [ $EXIT_CODE -eq 2 ]; then
            echo "has_changes=true" >> $GITHUB_OUTPUT
          else
            exit 1
          fi

      - name: Terraform Apply
        if: steps.plan.outputs.has_changes == 'true'
        run: terraform apply -auto-approve tfplan

  # ============================================================================
  # PRODUCTION DEPLOYMENT (apps-production namespace)
  # ============================================================================
  deploy:
    name: Deploy to Production
    needs: [build-image, terraform]
    runs-on: self-hosted
    environment: production
    env:
      NAMESPACE: apps-production

    steps:
      - name: Checkout code
        uses: actions/checkout@v6

      - name: Setup environment
        run: echo "KUBECONFIG=$HOME/.kube/config" >> $GITHUB_ENV

      - name: Verify Kubernetes access
        run: kubectl cluster-info

      - name: Create GHCR pull secret
        run: |
          kubectl create secret docker-registry ghcr-pull-secret \
            --docker-server=ghcr.io \
            --docker-username=${{ github.actor }} \
            --docker-password=${{ secrets.GITHUB_TOKEN }} \
            --namespace=${{ env.NAMESPACE }} \
            --dry-run=client -o yaml | kubectl apply -f -

      - name: Update image tag
        working-directory: ./k8s/overlays/production
        run: |
          sed -i "s|newTag: SHA_REPLACED_BY_CICD|newTag: ${{ env.IMAGE_TAG }}|g" kustomization.yaml

      - name: Inject Infisical secrets
        run: |
          sed -i "s|client-id: \"PLACEHOLDER_WILL_BE_REPLACED_BY_CICD\"|client-id: \"${{ secrets.INFISICAL_CLIENT_ID }}\"|g" k8s/base/infisical/secret.yaml
          sed -i "s|client-secret: \"PLACEHOLDER_WILL_BE_REPLACED_BY_CICD\"|client-secret: \"${{ secrets.INFISICAL_CLIENT_SECRET }}\"|g" k8s/base/infisical/secret.yaml
          sed -i "s|project-id: \"PLACEHOLDER_WILL_BE_REPLACED_BY_CICD\"|project-id: \"${{ secrets.INFISICAL_PROJECT_ID }}\"|g" k8s/base/infisical/secret.yaml

      - name: Preview manifests
        working-directory: ./k8s/overlays/production
        run: kubectl kustomize . | head -n 100

      - name: Deploy to Kubernetes
        working-directory: ./k8s/overlays/production
        run: kubectl apply -k .

      - name: Wait for rollout
        run: kubectl rollout status deployment/wisewizard -n ${{ env.NAMESPACE }} --timeout=10m

      - name: Deployment status
        run: |
          echo "=== Pods ==="
          kubectl get pods -n ${{ env.NAMESPACE }}
          echo "=== Logs ==="
          kubectl logs -n ${{ env.NAMESPACE }} -l app=wisewizard --tail=30 --prefix=true || true

      - name: Smoke test
        run: |
          sleep 10
          kubectl run curl-test --image=curlimages/curl --rm -i --restart=Never -n ${{ env.NAMESPACE }} -- \
            curl -f -m 5 http://wisewizard:8080/health || echo "Health check failed"
