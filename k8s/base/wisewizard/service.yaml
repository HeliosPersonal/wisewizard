apiVersion: v1
kind: Service
metadata:
  name: wisewizard
  labels:
    app: wisewizard
    app.kubernetes.io/part-of: wisewizard
spec:
  # ClusterIP only — WiseWizard has no public inbound traffic (Telegram is an
  # outbound long-poll). This Service exists for /health and the /hangfire
  # dashboard, reachable via `kubectl port-forward` (never exposed by Ingress).
  type: ClusterIP
  selector:
    app: wisewizard
  ports:
    - name: http
      port: 8080
      targetPort: 8080
