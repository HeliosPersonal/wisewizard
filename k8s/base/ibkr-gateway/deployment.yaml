apiVersion: apps/v1
kind: Deployment
metadata:
  name: ibkr-gateway
  labels:
    app: ibkr-gateway
    app.kubernetes.io/part-of: wisewizard
spec:
  replicas: 1
  # Single instance — IBKR session is stateful and bound to one gateway process.
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app: ibkr-gateway
  template:
    metadata:
      labels:
        app: ibkr-gateway
        app.kubernetes.io/part-of: wisewizard
    spec:
      imagePullSecrets:
        - name: ghcr-pull-secret
      containers:
        - name: ibkr-gateway
          image: ghcr.io/heliospersonal/ibkr-gateway:latest
          ports:
            - containerPort: 5000
          # TCP liveness — just verify the JVM is up and the port is bound.
          # Do NOT use /v1/api/tickle here: that endpoint requires an authenticated
          # IBKR session, so it would fail on every cold start and restart-loop
          # the pod before the owner can complete the daily 2FA.
          livenessProbe:
            tcpSocket:
              port: 5000
            initialDelaySeconds: 30
            periodSeconds: 60
            failureThreshold: 5
          resources:
            requests:
              cpu: 50m
              memory: 256Mi
            limits:
              cpu: "500m"
              memory: 512Mi
