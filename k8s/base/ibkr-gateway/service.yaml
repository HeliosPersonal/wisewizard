apiVersion: v1
kind: Service
metadata:
  name: ibkr-gateway
  labels:
    app: ibkr-gateway
    app.kubernetes.io/part-of: wisewizard
spec:
  # ClusterIP only — gateway is internal; reached via port-forward for 2FA.
  type: ClusterIP
  selector:
    app: ibkr-gateway
  ports:
    - name: https
      port: 5000
      targetPort: 5000
